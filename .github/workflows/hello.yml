name: My First Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      - name: Say hello
        run: echo "Pipeline is running. Code is here."

      - name: Check Python version
        run: python3 --version

      - name: List files in the repo
        run: ls -la
